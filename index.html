<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b1a">
<title>ڤیتۆ کۆڵیۆن</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ڤیتۆ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b1a; --text:#fff; --muted:rgba(255,255,255,.62);
  --glass:rgba(255,255,255,.10); --glass-b:rgba(255,255,255,.22); --glass-hi:rgba(255,255,255,.38);
  --blue:#0a84ff; --err:#ff6b6b;
}
@media (prefers-color-scheme:light){
  :root{--bg:#e9ecf8;--text:#10101c;--muted:rgba(16,16,28,.6);--glass:rgba(255,255,255,.55);--glass-b:rgba(255,255,255,.8);--glass-hi:#fff}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:-apple-system,"SF Pro Display","Vazirmatn",system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  min-height:100vh;overflow-x:hidden;
}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;z-index:0;animation:float 18s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;background:#5e5ce6;top:-20vmax;right:-15vmax}
.b2{width:50vmax;height:50vmax;background:#ff375f;bottom:-18vmax;left:-12vmax;animation-delay:-6s}
.b3{width:36vmax;height:36vmax;background:#32d2ff;top:35%;left:20%;opacity:.45;animation-delay:-12s}
@keyframes float{to{transform:translate(6vmax,-4vmax) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:36px 18px 48px}
.glass{
  background:var(--glass);
  backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--glass-b);border-radius:30px;
  box-shadow:inset 0 1.5px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.25);
}
header{text-align:center;margin-bottom:26px}
.logo{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;display:grid;place-items:center;font-size:36px;
  background:linear-gradient(145deg,#0a84ff,#bf5af2);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 12px 30px rgba(10,132,255,.45)}
h1{font-size:34px;font-weight:800;margin:0 0 6px;letter-spacing:-.5px}
header p{margin:0;color:var(--muted);font-size:15px}
.card{padding:18px}
.field{display:flex;gap:10px;align-items:center;padding:6px;border-radius:24px;background:rgba(0,0,0,.18);border:1px solid var(--glass-b)}
@media (prefers-color-scheme:light){.field{background:rgba(255,255,255,.6)}}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:12px 14px;direction:ltr;text-align:left}
input::placeholder{color:var(--muted)}
.paste{border:0;background:var(--glass);color:var(--text);font:inherit;font-size:14px;padding:10px 14px;border-radius:18px;cursor:pointer;border:1px solid var(--glass-b)}
.btn{width:100%;margin-top:12px;border:0;border-radius:22px;padding:16px;font:inherit;font-size:17px;font-weight:600;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#3b9cff,#0a84ff);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 10px 24px rgba(10,132,255,.45);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55}
:focus-visible{outline:3px solid #64d2ff;outline-offset:2px}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips span{font-size:13px;padding:7px 13px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-b);color:var(--muted)}
#msg{margin:14px 4px 0;text-align:center;font-size:14px;color:var(--err);min-height:0}
#result{display:none;margin-top:18px;overflow:hidden}
#result.show{display:block;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:rgba(0,0,0,.3)}
.info{padding:16px 18px 6px}
.info h2{margin:0;font-size:16px;font-weight:600;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info small{color:var(--muted)}
.qs{padding:8px 14px 16px;display:grid;gap:8px}
.q{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-b);color:var(--text);text-decoration:none;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.q:active{transform:scale(.98)}
.q em{font-style:normal;color:var(--muted);font-weight:400;font-size:14px;direction:ltr}
.q i{font-style:normal;color:var(--blue)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;line-height:1.8}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-inline-start:8px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
  <header>
    <div class="logo">⬇︎</div>
    <h1>ڤیتۆ کۆڵیۆن</h1>
    <p>لینکی ڤیدیۆکە لێرە دابنێ و دایبگرە</p>
  </header>

  <section class="glass card">
    <div class="field">
      <button class="paste" id="paste" type="button">لکاندن</button>
      <input id="url" type="url" inputmode="url" placeholder="https://" aria-label="لینکی ڤیدیۆ" autocomplete="off">
    </div>
    <button class="btn" id="go" type="button">دۆزینەوە</button>
    <div class="chips"><span>تیکتۆک</span><span>ئینستاگرام</span><span>فەیسبووک</span><span>پینترێست</span><span>سناپچات</span></div>
  </section>

  <div id="msg" role="alert"></div>

  <section class="glass" id="result">
    <img class="thumb" id="thumb" alt="">
    <div class="info"><h2 id="title"></h2><small id="dur"></small></div>
    <div class="qs" id="qs"></div>
  </section>

  <footer>تەنها ئەو ڤیدیۆیانە دابگرە کە هی خۆتن یان مۆڵەتت هەیە.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const urlEl = $('url'), go = $('go'), msg = $('msg'), result = $('result');
let current = '';

const mb = b => b ? (b/1048576 >= 10 ? Math.round(b/1048576) : (b/1048576).toFixed(1)) + ' MB' : '';
const fmtDur = s => s ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '';

$('paste').onclick = async () => {
  try { urlEl.value = await navigator.clipboard.readText(); urlEl.focus(); }
  catch { urlEl.focus(); }
};

async function find() {
  const url = urlEl.value.trim();
  msg.textContent = ''; result.classList.remove('show');
  if (!url) { msg.textContent = 'تکایە لینکێک دابنێ.'; return; }
  go.disabled = true; go.innerHTML = 'دەدۆزرێتەوە<span class="spin"></span>';
  try {
    const r = await fetch('/api/info', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ url }) });
    let d = null;
    try { d = await r.json(); } catch {}
    if (!d) {
      msg.textContent = (r.status === 502 || r.status === 503 || r.status === 504)
        ? 'سێرڤەر خەوتووە و خەریکە هەڵدەستێتەوە. ٣٠ چرکە چاوەڕێ بکە و دووبارە دۆزینەوە بکە.'
        : 'سێرڤەری دابەزاندن کار ناکات (کۆدی ' + r.status + '). دڵنیابە سایتەکە لەسەر Render دانراوە، نەک GitHub Pages.';
      return;
    }
    if (!r.ok) {
      msg.textContent = d.error === 'unsupported'
        ? 'ئەم لینکە پشتگیری ناکرێت. تەنها تیکتۆک، ئینستاگرام، فەیسبووک، پینترێست و سناپچات.'
        : 'ڤیدیۆکە نەدۆزرایەوە. دڵنیابە لینکەکە گشتییە (private نییە).';
      return;
    }
    current = url;
    $('thumb').src = d.thumbnail || ''; $('thumb').style.display = d.thumbnail ? 'block' : 'none';
    $('title').textContent = d.title; $('dur').textContent = fmtDur(d.duration);
    const qs = $('qs'); qs.innerHTML = '';
    d.qualities.forEach(q => {
      const a = document.createElement('a');
      a.className = 'q';
      a.href = '/api/download?h=' + q.height + '&url=' + encodeURIComponent(url);
      a.innerHTML = '<i>دابەزاندن</i><span>' + (q.height ? q.height + 'p' : 'باشترین کوالیتی') + '</span><em>' + mb(q.size) + '</em>';
      qs.appendChild(a);
    });
    result.classList.add('show');
    result.scrollIntoView({ behavior:'smooth', block:'nearest' });
  } catch {
    msg.textContent = 'پەیوەندی بە سێرڤەرەوە نییە. ئینتەرنێتەکەت بپشکنە، یان سایتەکە لە ڕێگای لینکی Render بکەرەوە.';
  } finally {
    go.disabled = false; go.textContent = 'دۆزینەوە';
  }
}
go.onclick = find;
urlEl.addEventListener('keydown', e => { if (e.key === 'Enter') find(); });
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
